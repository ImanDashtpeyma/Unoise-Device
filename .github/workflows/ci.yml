name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        run: python -m pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t unoise-device .

      - name: Smoke test the container
        run: |
          docker run -d --name unoise -p 10000:10000 unoise-device
          sleep 8
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:10000/chart)" = "404"
          docker logs unoise
          docker stop unoise
